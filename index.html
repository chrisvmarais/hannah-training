<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moab 2026">
<meta name="theme-color" content="#1a1a1a">
<title>Moab Trail Marathon 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #1D9E75;
  --teal-light: #d0f0e4;
  --teal-dark: #0e5a41;
  --coral: #D85A30;
  --coral-light: #fbe8e0;
  --amber: #D4920A;
  --amber-light: #fdf0d0;
  --purple: #6B5BD6;
  --purple-light: #eceafc;
  --sand: #f5f0e8;
  --sand-dark: #e8e0d0;
  --ink: #1a1a1a;
  --ink-mid: #444;
  --ink-light: #888;
  --white: #ffffff;
  --card-bg: #ffffff;
  --page-bg: #f5f0e8;
  --border: rgba(0,0,0,0.10);
  --radius: 14px;
  --radius-sm: 8px;
  --font-display: 'DM Serif Display', serif;
  --font-body: 'DM Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  font-family: var(--font-body);
  background: var(--page-bg);
  color: var(--ink);
  overflow-x: hidden;
}

/* ── APP SHELL ── */
#app { min-height: 100vh; padding-bottom: 40px; }

/* ── HEADER ── */
.app-header {
  background: var(--ink);
  color: white;
  padding: 52px 20px 24px;
  position: relative;
  overflow: hidden;
}
.app-header::before {
  content: '';
  position: absolute;
  top: -60px; right: -40px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(29,158,117,0.15);
}
.app-header::after {
  content: '';
  position: absolute;
  bottom: -30px; left: 30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(216,90,48,0.12);
}
.header-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 6px;
  position: relative; z-index: 1;
}
.header-title {
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 1.15;
  color: white;
  position: relative; z-index: 1;
}
.header-title em { color: var(--teal); font-style: italic; }
.header-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  margin-top: 8px;
  position: relative; z-index: 1;
}
.phase-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: rgba(255,255,255,0.75);
  margin-top: 12px;
  position: relative; z-index: 1;
}
.phase-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }

/* ── SECTION NAV ── */
.section-nav {
  display: flex;
  gap: 0;
  background: var(--ink);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.section-nav::-webkit-scrollbar { display: none; }
.snav-btn {
  flex-shrink: 0;
  padding: 12px 18px;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.4);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  letter-spacing: .04em;
  transition: all .2s;
  white-space: nowrap;
}
.snav-btn.active {
  color: white;
  border-bottom-color: var(--teal);
}

/* ── SECTION ── */
.section { display: none; padding: 16px; }
.section.active { display: block; }

/* ── WEEK NAVIGATION ── */
.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.week-nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card-bg);
  font-size: 18px;
  color: var(--ink-mid);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.week-nav-btn:active { background: var(--sand-dark); transform: scale(.95); }
.week-label {
  text-align: center;
  flex: 1;
}
.week-label-top {
  font-size: 11px;
  color: var(--ink-light);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.week-label-main {
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--ink);
}

/* ── TODAY CARD ── */
.today-banner {
  background: var(--ink);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.today-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.today-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,0.45); }
.today-name { font-size: 15px; font-weight: 600; color: white; }
.today-detail { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 1px; }

/* ── DAY CARDS ── */
.day-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: box-shadow .2s;
}
.day-card.is-today { border-color: var(--teal); border-width: 2px; }
.day-card.logged { opacity: 0.72; }

.day-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  cursor: pointer;
}
.day-dot-wrap {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
}
.day-info { flex: 1; min-width: 0; }
.day-name-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.day-name { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: .07em; }
.day-date { font-size: 10px; color: var(--ink-light); }
.day-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 1px; }
.day-sub { font-size: 12px; color: var(--ink-light); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.log-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all .15s;
}
.log-btn.done { background: var(--teal); border-color: var(--teal); }
.log-btn.done::after { content: '✓'; font-size: 13px; color: white; font-weight: 700; }
.log-btn:not(.done)::after { content: '○'; color: var(--ink-light); font-size: 16px; }
.log-btn:active { transform: scale(.9); }

.delete-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: none;
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--ink-light);
  transition: all .15s;
  display: none;
}
.delete-btn.visible { display: flex; }
.delete-btn:active { color: var(--coral); transform: scale(.9); }

.chevron {
  font-size: 12px;
  color: var(--ink-light);
  transition: transform .2s;
  flex-shrink: 0;
}
.day-card.open .chevron { transform: rotate(180deg); }

/* ── DAY DETAIL ── */
.day-detail-panel {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--sand);
}
.day-card.open .day-detail-panel { display: block; }

.detail-section { padding: 14px 14px 4px; }
.detail-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 8px;
}
.superset-block {
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 8px;
}
.superset-header {
  padding: 6px 10px;
  background: var(--sand-dark);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-light);
  border-bottom: 1px solid var(--border);
}
.exercise-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.exercise-row:last-child { border-bottom: none; }
.ex-name { font-size: 13px; color: var(--ink); font-weight: 500; }
.ex-note { font-size: 11px; color: var(--ink-light); margin-top: 2px; }
.ex-sets { font-size: 12px; color: var(--ink-mid); white-space: nowrap; padding-left: 8px; flex-shrink: 0; font-weight: 500; }

.run-detail-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.run-detail-row:last-child { border-bottom: none; }
.rdl { color: var(--ink-mid); }
.rdr { color: var(--ink); font-weight: 500; text-align: right; padding-left: 8px; }

.log-note-area {
  padding: 10px 14px 14px;
}
.log-note-area textarea {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink);
  resize: none;
  min-height: 70px;
  outline: none;
}
.log-note-area textarea::placeholder { color: var(--ink-light); }
.log-note-area textarea:focus { border-color: var(--teal); }
.save-note-btn {
  margin-top: 8px;
  width: 100%;
  padding: 10px;
  background: var(--teal);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.save-note-btn:active { background: var(--teal-dark); transform: scale(.98); }

/* ── TYPE COLORS ── */
.type-run   { background: #e0f5ec; }
.type-run .day-title { color: var(--teal-dark); }
.dot-run   { background: var(--teal); }

.type-gym   { background: var(--purple-light); }
.type-gym .day-title { color: #3d2fa0; }
.dot-gym   { background: var(--purple); }

.type-yoga  { background: var(--coral-light); }
.type-yoga .day-title { color: #7a2e14; }
.dot-yoga  { background: var(--coral); }

.type-race  { background: var(--amber-light); }
.type-race .day-title { color: #7a4d00; }
.dot-race  { background: var(--amber); }

.type-rest  { background: var(--sand); }
.type-rest .day-title { color: var(--ink-light); }
.dot-rest  { background: var(--sand-dark); border: 1.5px solid var(--border); }

/* ── RACE CALENDAR (overview) ── */
.race-list { display: flex; flex-direction: column; gap: 8px; }
.race-item {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 13px 14px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.race-item.a-race { border-color: var(--coral); border-width: 2px; }
.race-item.b-race { border-color: var(--amber); border-width: 1.5px; }
.race-dot-lg {
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}
.race-date-col { min-width: 72px; flex-shrink: 0; }
.race-date-main { font-size: 12px; font-weight: 600; color: var(--ink-mid); }
.race-date-day { font-size: 10px; color: var(--ink-light); }
.race-name { font-size: 14px; font-weight: 600; color: var(--ink); }
.race-sub { font-size: 12px; color: var(--ink-light); margin-top: 2px; }
.race-note-text { font-size: 11px; color: var(--ink-light); margin-top: 3px; font-style: italic; }

.race-section-header {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-light);
  padding: 16px 0 6px;
}

/* ── GYM REFERENCE ── */
.gym-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 12px;
  overflow: hidden;
}
.gym-card-header {
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  cursor: pointer;
  background: var(--card-bg);
}
.gym-card-header:active { background: var(--sand); }
.gym-card-title { font-size: 15px; font-weight: 600; color: var(--ink); }
.gym-card-sub { font-size: 12px; color: var(--ink-light); margin-top: 3px; }
.gym-card-body { display: none; border-top: 1px solid var(--border); }
.gym-card.open .gym-card-body { display: block; }
.gym-card.open .gym-chevron { transform: rotate(180deg); }
.gym-chevron { font-size: 12px; color: var(--ink-light); transition: transform .2s; margin-top: 4px; }

.gym-block-label {
  font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-light); padding: 12px 14px 6px;
}

/* ── YOGA ── */
.yoga-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 12px;
  overflow: hidden;
}
.yoga-card-header {
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  cursor: pointer;
}
.yoga-card-header:active { background: var(--sand); }
.yoga-card-title { font-size: 15px; font-weight: 600; color: var(--ink); }
.yoga-card-sub { font-size: 12px; color: var(--ink-light); margin-top: 3px; }
.yoga-card-body { display: none; border-top: 1px solid var(--border); }
.yoga-card.open .yoga-card-body { display: block; }
.yoga-card.open .yoga-chevron { transform: rotate(180deg); }
.yoga-chevron { font-size: 12px; color: var(--ink-light); transition: transform .2s; margin-top: 4px; }
.yoga-pose-row {
  display: flex; justify-content: space-between;
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.yoga-pose-row:last-child { border-bottom: none; }
.pose-name { color: var(--ink); font-weight: 500; }
.pose-note { font-size: 11px; color: var(--ink-light); margin-top: 2px; }
.pose-dur { color: var(--ink-mid); white-space: nowrap; padding-left: 8px; font-weight: 500; font-size: 12px; }

/* ── INFO CARDS (phase banners, run guide) ── */
.info-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px;
  margin-bottom: 10px;
}
.info-card h3 { font-family: var(--font-display); font-size: 17px; color: var(--ink); margin-bottom: 5px; }
.info-card p { font-size: 13px; color: var(--ink-mid); line-height: 1.6; }
.badge {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 20px; margin: 4px 4px 0 0;
}
.badge-teal { background: var(--teal-light); color: var(--teal-dark); }
.badge-coral { background: var(--coral-light); color: #7a2e14; }
.badge-purple { background: var(--purple-light); color: #3d2fa0; }
.badge-gray { background: var(--sand-dark); color: var(--ink-mid); }
.badge-amber { background: var(--amber-light); color: #7a4d00; }

.hr-zone-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.hr-zone-row:last-child { border-bottom: none; }
.zone-label { font-size: 12px; color: var(--ink-mid); min-width: 28px; }
.zone-bar-wrap { flex: 1; height: 5px; background: var(--sand-dark); border-radius: 3px; overflow: hidden; }
.zone-bar { height: 100%; border-radius: 3px; }
.zone-bpm { font-size: 11px; color: var(--ink-light); min-width: 90px; text-align: right; }

.downhill-tip { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.downhill-tip:last-child { border-bottom: none; }
.tip-bullet { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.tip-body { flex: 1; }
.tip-title { font-size: 13px; font-weight: 600; color: var(--ink); }
.tip-desc { font-size: 12px; color: var(--ink-light); margin-top: 2px; line-height: 1.5; }

/* ── SECTION TITLES ── */
.sec-title {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 14px;
}
.sec-sub { font-size: 13px; color: var(--ink-light); margin-top: -10px; margin-bottom: 14px; }

/* ── LOGGED NOTE DISPLAY ── */
.logged-note-display {
  background: var(--teal-light);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin: 0 14px 12px;
  font-size: 12px;
  color: var(--teal-dark);
  display: none;
}
.logged-note-display.has-note { display: block; }
.logged-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }

/* ── PROGRESS BAR ── */
.progress-wrap {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px;
  margin-bottom: 12px;
}
.progress-title { font-size: 12px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.progress-bar-bg { height: 6px; background: var(--sand-dark); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.progress-bar-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width .4s ease; }
.progress-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-light); }
.progress-num { font-family: var(--font-display); font-size: 20px; color: var(--teal); }

</style>
</head>
<body>
<div id="app">

  <div class="app-header">
    <div class="header-eyebrow">Training Plan · 2026</div>
    <div class="header-title">Moab Trail<br><em>Marathon</em></div>
    <div class="header-sub">Hannah · Nov 7, 2026</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;position:relative;z-index:1;flex-wrap:wrap">
      <div class="phase-pill" id="current-phase-pill" style="margin-top:0">
        <div class="phase-dot"></div>
        <span id="phase-pill-text">Loading...</span>
      </div>
      <div id="sync-badge" style="font-size:10px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);transition:background .4s">⟳ syncing</div>
    </div>
  </div>

  <div class="section-nav">
    <button class="snav-btn active" onclick="showSection('schedule',this)">Schedule</button>
    <button class="snav-btn" onclick="showSection('races',this)">Races</button>
    <button class="snav-btn" onclick="showSection('gym',this)">Gym</button>
    <button class="snav-btn" onclick="showSection('yoga',this)">Yoga</button>
    <button class="snav-btn" onclick="showSection('running',this)">Running</button>
    <button class="snav-btn" onclick="showSection('overview',this)">Plan</button>
  </div>

  <!-- SCHEDULE -->
  <div id="sec-schedule" class="section active">
    <div class="week-nav">
      <button class="week-nav-btn" onclick="changeWeek(-1)">‹</button>
      <div class="week-label">
        <div class="week-label-top" id="wk-phase">Phase 1</div>
        <div class="week-label-main" id="wk-label">Week 1</div>
      </div>
      <button class="week-nav-btn" onclick="changeWeek(1)">›</button>
    </div>
    <div id="week-days"></div>
  </div>

  <!-- RACES -->
  <div id="sec-races" class="section">
    <div class="sec-title">Race Calendar</div>
    <div class="race-list" id="race-list"></div>
  </div>

  <!-- GYM -->
  <div id="sec-gym" class="section">
    <div class="sec-title">Gym Workouts</div>
    <div class="sec-sub">35–40 min · no wrist weight bearing · Tue &amp; Fri</div>
    <div id="gym-content"></div>
  </div>

  <!-- YOGA -->
  <div id="sec-yoga" class="section">
    <div class="sec-title">Yoga</div>
    <div class="sec-sub">Monday · 45 min · alternating A / B each week</div>
    <div id="yoga-content"></div>
  </div>

  <!-- RUNNING -->
  <div id="sec-running" class="section">
    <div class="sec-title">Running Guide</div>

let currentWeek = 0;
let logs = JSON.parse(localStorage.getItem('moab-logs') || '{}');

// saveLog / deleteLog are defined here as localStorage-only fallbacks.
// Once Firebase initialises, initFirebase() redefines them to sync to the DB.
function saveLog(key, data) {
  logs[key] = data;
  localStorage.setItem('moab-logs', JSON.stringify(logs));
}
function getLog(key) { return logs[key] || null; }
function deleteLog(key) {
  delete logs[key];
  localStorage.setItem('moab-logs', JSON.stringify(logs));
}

// Find current week based on today's date
function initCurrentWeek() {
  const today = new Date();
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  const weeksSinceStart = Math.floor((today - PLAN_START) / msPerWeek);
  currentWeek = Math.max(0, Math.min(weeksSinceStart, WEEKS.length - 1));
}

function getWeekStartDate(weekIdx) {
  const d = new Date(PLAN_START);
  d.setDate(d.getDate() + weekIdx * 7);
  return d;
}

function getDayDate(weekIdx, dayIdx) {
  const start = getWeekStartDate(weekIdx);
  start.setDate(start.getDate() + dayIdx);
  return start;
}

function isToday(weekIdx, dayIdx) {
  const d = getDayDate(weekIdx, dayIdx);
  const today = new Date();
  return d.toDateString() === today.toDateString();
}

function logKey(weekIdx, dayIdx) {
  // Date-based key (not position-based) so editing the schedule later
  // never causes old completions to bleed onto different days.
  const d = getDayDate(weekIdx, dayIdx);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function renderSchedule() {
  const week = WEEKS[currentWeek];
  document.getElementById('wk-phase').textContent = week.phase;
  document.getElementById('wk-label').textContent = week.label + ' · ' + week.miles;

  // Update phase pill
  document.getElementById('phase-pill-text').textContent = week.phase;

  const container = document.getElementById('week-days');
  container.innerHTML = '';

  // Progress bar
  const totalDays = WEEKS.length * 7;
  const completedDays = Object.keys(logs).filter(k => logs[k] && logs[k].done).length;
  const pct = Math.round((completedDays / totalDays) * 100);
  container.innerHTML += `
    <div class="progress-wrap">
      <div class="progress-title">Overall Progress</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
        <span class="progress-num">${completedDays}</span>
        <span style="font-size:12px;color:var(--ink-light)">workouts logged of ${totalDays} total</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-stats"><span>${pct}% complete</span><span>Moab: Nov 7, 2026</span></div>
    </div>`;

  week.days.forEach((day, dayIdx) => {
    const key = logKey(currentWeek, dayIdx);
    const log = getLog(key);
    const done = log && log.done;
    const today = isToday(currentWeek, dayIdx);
    const dayDate = getDayDate(currentWeek, dayIdx);
    const dateStr = dayDate.toLocaleDateString('en-US', { month:'short', day:'numeric' });

    const card = document.createElement('div');
    card.className = `day-card type-${day.type}${today ? ' is-today' : ''}${done ? ' logged' : ''}`;
    card.id = `day-card-${dayIdx}`;

    card.innerHTML = `
      <div class="day-header" onclick="toggleDay(${dayIdx})">
        <div class="day-dot-wrap type-${day.type}">
          <span style="font-size:18px">${day.emoji}</span>
        </div>
        <div class="day-info">
          <div class="day-name-row">
            <span class="day-name">${day.d}</span>
            <span class="day-date">${dateStr}</span>
            ${today ? '<span style="font-size:9px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.1em">Today</span>' : ''}
          </div>
          <div class="day-title">${day.title}</div>
          <div class="day-sub">${day.sub}</div>
        </div>
        <div class="day-actions">
          <button class="log-btn ${done ? 'done' : ''}" id="log-btn-${dayIdx}" onclick="event.stopPropagation();toggleLog(${dayIdx})"></button>
          <button class="delete-btn ${done ? 'visible' : ''}" id="del-btn-${dayIdx}" onclick="event.stopPropagation();deleteEntry(${dayIdx})" title="Delete log">✕</button>
          <span class="chevron">▾</span>
        </div>
      </div>
      ${log && log.note ? `<div class="logged-note-display has-note" id="note-display-${dayIdx}"><div class="logged-label">Your note</div>${log.note}</div>` : `<div class="logged-note-display" id="note-display-${dayIdx}"></div>`}
      <div class="day-detail-panel" id="detail-panel-${dayIdx}">
        ${renderDayDetail(day, dayIdx, log)}
      </div>`;

    container.appendChild(card);
  });
}

function toggleDay(dayIdx) {
  const card = document.getElementById(`day-card-${dayIdx}`);
  card.classList.toggle('open');
}

function toggleLog(dayIdx) {
  const key = logKey(currentWeek, dayIdx);
  const log = getLog(key) || {};
  const newDone = !log.done;
  saveLog(key, { ...log, done: newDone });
  renderSchedule();
  // Re-open the card if it was open
}

function deleteEntry(dayIdx) {
  const key = logKey(currentWeek, dayIdx);
  deleteLog(key);
  renderSchedule();
}

function saveNote(dayIdx) {
  const key = logKey(currentWeek, dayIdx);
  const note = document.getElementById(`note-input-${dayIdx}`).value.trim();
  const log = getLog(key) || {};
  saveLog(key, { ...log, note });
  // Update display
  const disp = document.getElementById(`note-display-${dayIdx}`);
  if (note) {
    disp.className = 'logged-note-display has-note';
    disp.innerHTML = `<div class="logged-label">Your note</div>${note}`;
  } else {
    disp.className = 'logged-note-display';
  }
  // Brief feedback
  const btn = document.querySelector(`#day-card-${dayIdx} .save-note-btn`);
  btn.textContent = 'Saved ✓';
  btn.style.background = '#0e5a41';
  setTimeout(() => { btn.textContent = 'Save note'; btn.style.background = ''; }, 1500);
}

function changeWeek(dir) {
  currentWeek = Math.max(0, Math.min(currentWeek + dir, WEEKS.length - 1));
  renderSchedule();
  window.scrollTo(0, 0);
}

// FIREBASE SYNC
// ─────────────────────────────────────────────
// All logs live at /hannah/logs/{key} in Firebase.
// localStorage is used as an instant read cache so
// the UI never waits for the network on load.

const FB_CONFIG = {
  apiKey: "AIzaSyAQQstlHpmuag7L2811rS3GfTmNoVpBy6E",
  authDomain: "chore-chart-v2.firebaseapp.com",
  databaseURL: "https://chore-chart-v2-default-rtdb.firebaseio.com",
  projectId: "chore-chart-v2",
  storageBucket: "chore-chart-v2.firebasestorage.app",
  messagingSenderId: "322816069788",
  appId: "1:322816069788:web:d49ece311c0598a5639d59"
};

const FB_PATH = 'hannah/logs';
let db = null;
let fbLogsRef = null;
let syncStatus = 'connecting'; // 'connecting' | 'synced' | 'offline'

function initFirebase() {
  try {
    firebase.initializeApp(FB_CONFIG);
    db = firebase.database();
    fbLogsRef = db.ref(FB_PATH);
    _fbReady();

    // Show sync indicator
    updateSyncBadge('connecting');

    // Listen for all log changes in real-time
    fbLogsRef.on('value', (snapshot) => {
      const fbData = snapshot.val() || {};
      // Merge Firebase data into local cache + memory
      logs = { ...logs, ...fbData };
      localStorage.setItem('moab-logs', JSON.stringify(logs));
      updateSyncBadge('synced');
      // Re-render schedule if it's active (won't disrupt other tabs)
      const schedActive = document.getElementById('sec-schedule').classList.contains('active');
      if (schedActive) renderSchedule();
    }, (err) => {
      console.warn('Firebase read error:', err);
      updateSyncBadge('offline');
    });

    // Detect connectivity
    db.ref('.info/connected').on('value', snap => {
      updateSyncBadge(snap.val() ? 'synced' : 'offline');
    });

  } catch(e) {
    console.warn('Firebase init failed:', e);
    updateSyncBadge('offline');
  }
}

function fbSaveLog(key, data) {
  // Write to local immediately, fire to Firebase
  logs[key] = data;
  localStorage.setItem('moab-logs', JSON.stringify(logs));
  if (fbLogsRef) {
    fbLogsRef.child(key).set(data).catch(e => console.warn('FB write error:', e));
  }
}

function fbDeleteLog(key) {
  delete logs[key];
  localStorage.setItem('moab-logs', JSON.stringify(logs));
  if (fbLogsRef) {
    fbLogsRef.child(key).remove().catch(e => console.warn('FB delete error:', e));
  }
}

// Override the localStorage-only functions with Firebase-backed versions
// called once Firebase is ready
function _fbReady() {
  saveLog  = fbSaveLog;
  deleteLog = fbDeleteLog;
}

// ── Sync status badge ──
function updateSyncBadge(status) {
  syncStatus = status;
  const badge = document.getElementById('sync-badge');
  if (!badge) return;
  const configs = {
    connecting: { text: '⟳ syncing', color: 'rgba(255,255,255,0.3)' },
    synced:     { text: '✓ synced',  color: 'rgba(29,158,117,0.7)' },
    offline:    { text: '⚡ offline', color: 'rgba(216,90,48,0.7)' },
  };
  const c = configs[status] || configs.offline;
  badge.textContent = c.text;
  badge.style.background = c.color;
}
